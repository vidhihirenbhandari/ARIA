name: aria_mobile
description: ARIA - Adaptive Real-time Intelligence System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  go_router: ^13.0.0
  dio: ^5.4.0
  hive_flutter: ^1.1.0
  google_sign_in: ^6.2.0
  flutter_tts: ^3.8.0
  speech_to_text: ^6.6.0
  shimmer: ^3.0.0
  intl: ^0.19.0
  encrypt: ^5.0.3
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  cupertino_icons: ^1.0.6
  flutter_local_notifications: ^17.2.4
  flutter_contacts: ^1.1.9+1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  freezed: ^2.4.5
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
