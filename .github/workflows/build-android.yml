name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build APK (release)
        working-directory: mobile
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          mkdir -p artifacts
          cp mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk  artifacts/ARIA-arm64.apk
          cp mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk artifacts/ARIA-arm32.apk
          cp mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk      artifacts/ARIA-x86_64.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ARIA-APKs
          path: artifacts/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
          body: |
            ## Install on Android

            1. Download **ARIA-arm64.apk** (most modern phones) or **ARIA-arm32.apk** (older phones)
            2. On your phone: Settings → Apps → Install unknown apps → allow your browser
            3. Open the downloaded file and tap **Install**
